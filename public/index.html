<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales TV — Metodo Regina</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ═══════════ LOGIN ═══════════ -->
  <div id="login" class="login-wrap">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-brand">
        <div class="login-icon">👑</div>
        <div>
          <div class="login-title">Sales TV</div>
          <div class="login-sub">Il gestionale del team vendita di Metodo Regina</div>
        </div>
      </div>
      <label class="login-field">
        <span>Email</span>
        <input type="email" name="email" id="loginEmail" required autofocus />
      </label>
      <label class="login-field">
        <span>Password</span>
        <input type="password" name="password" id="loginPass" required />
      </label>
      <div id="loginError" class="login-error"></div>
      <button class="login-btn" type="submit">Accedi</button>
      <a href="#" id="forgotLink" class="login-forgot">Password dimenticata?</a>
    </form>
  </div>

  <!-- ═══════════ FORGOT PASSWORD MODAL ═══════════ -->
  <div id="forgotModal" class="modal-wrap" hidden>
    <div class="modal-card">
      <button class="modal-close" id="forgotClose" aria-label="Chiudi">×</button>
      <div class="modal-icon">🔑</div>
      <h2 class="modal-title">Password dimenticata?</h2>
      <p class="modal-text">
        Per recuperare l'accesso a Sales TV Metodo Regina scrivi a<br>
        <a href="mailto:info@sofiadigiovanni.com?subject=Recupero%20accesso%20Sales%20TV" class="modal-mail">info@sofiadigiovanni.com</a>
      </p>
      <p class="modal-hint">Riceverai le nuove credenziali via email entro poche ore.</p>
      <a href="mailto:info@sofiadigiovanni.com?subject=Recupero%20accesso%20Sales%20TV" class="modal-btn">Invia richiesta</a>
    </div>
  </div>

  <!-- ═══════════ APP ═══════════ -->
  <div id="app" class="page" hidden>

    <!-- HEADER -->
    <header class="page-header">
      <h1 class="page-h1">Sales TV</h1>
      <div class="page-actions">
        <button id="refreshBtn" class="btn btn-primary">🔄 AGGIORNA</button>
        <button id="logoutBtn" class="btn btn-ghost" title="Logout">⋯</button>
      </div>
    </header>

    <!-- TABS -->
    <nav class="tabs" id="tabs"></nav>

    <!-- PERIOD FILTER -->
    <div class="period-bar">
      <div class="period-pills" id="periodPills">
        <button class="pill" data-period="thisMonth">Questo mese</button>
        <button class="pill" data-period="thisWeek">Questa settimana</button>
        <button class="pill" data-period="lastMonth">Mese scorso</button>
        <button class="pill" data-period="ytd">Quest'anno</button>
        <button class="pill active" data-period="all">Sempre</button>
      </div>
      <div class="period-range">
        <input type="date" id="dateFrom" />
        <span class="arrow">→</span>
        <input type="date" id="dateTo" />
      </div>
    </div>

    <!-- CONTENT -->
    <main class="content" id="viewContent"></main>

  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
